<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="640" fill="white"/>
  <defs>
    <marker id="open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 0 L10 5 L0 10" fill="none" stroke="#222" stroke-width="1.4"/>
    </marker>
  </defs>
  <!-- system boundary -->
  <rect x="230" y="40" width="740" height="570" fill="#FAFBFD" stroke="#222" stroke-width="1.5"/>
  <text x="600" y="72" text-anchor="middle" font-size="20" font-weight="bold">FHNW Room Booking System</text>

  <!-- actor -->
  <g stroke="#222" stroke-width="2" fill="none">
    <circle cx="100" cy="270" r="18"/>
    <line x1="100" y1="288" x2="100" y2="345"/>
    <line x1="68" y1="308" x2="132" y2="308"/>
    <line x1="100" y1="345" x2="74" y2="385"/>
    <line x1="100" y1="345" x2="126" y2="385"/>
  </g>
  <text x="100" y="412" text-anchor="middle" font-size="17">Student</text>

  <!-- associations actor - use cases -->
  <g stroke="#222" stroke-width="1.4">
    <line x1="135" y1="300" x2="300" y2="160"/>
    <line x1="135" y1="310" x2="300" y2="290"/>
    <line x1="135" y1="320" x2="300" y2="420"/>
    <line x1="135" y1="330" x2="310" y2="540"/>
  </g>

  <!-- use cases -->
  <g fill="#EAF1FB" stroke="#222" stroke-width="1.5">
    <ellipse cx="400" cy="160" rx="100" ry="36"/>
    <ellipse cx="400" cy="290" rx="100" ry="36"/>
    <ellipse cx="400" cy="420" rx="100" ry="36"/>
    <ellipse cx="410" cy="540" rx="100" ry="36"/>
    <ellipse cx="790" cy="225" rx="115" ry="38"/>
  </g>
  <g font-size="17" text-anchor="middle">
    <text x="400" y="166">Book a room</text>
    <text x="400" y="296">Find free rooms</text>
    <text x="400" y="426">View my bookings</text>
    <text x="410" y="546">Cancel booking</text>
    <text x="790" y="231">Check availability</text>
  </g>

  <!-- include relationships -->
  <g stroke="#222" stroke-width="1.4" stroke-dasharray="7 5" fill="none">
    <line x1="500" y1="170" x2="680" y2="213" marker-end="url(#open)"/>
    <line x1="500" y1="280" x2="682" y2="240" marker-end="url(#open)"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#222">
    <text x="590" y="172">«include»</text>
    <text x="590" y="285">«include»</text>
  </g>

  <!-- notes -->
  <g font-size="13" fill="#444">
    <text x="660" y="300">Check availability = opening hours (Availability),</text>
    <text x="660" y="318">no holiday (CalendarDay), start before end and</text>
    <text x="660" y="336">no overlap with an active booking (rules 1, 2, 4)</text>
    <text x="545" y="540">Soft cancellation: status = CANCELLED (rule 3)</text>
  </g>
</svg>
